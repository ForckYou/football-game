<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Football Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>⚽ Football Game</h1>
            <div class="score-board">
                <div class="team team-home">
                    <h2 id="homeTeam">Your Team</h2>
                    <p class="score" id="homeScore">0</p>
                </div>
                <div class="vs">VS</div>
                <div class="team team-away">
                    <h2 id="awayTeam">CPU Team</h2>
                    <p class="score" id="awayScore">0</p>
                </div>
            </div>
            <div class="match-info">
                <p>Time: <span id="matchTime">0</span>'</p>
                <p>Possession: <span id="possession">50</span>%</p>
            </div>
        </header>

        <div class="game-board">
            <div class="field">
                <div class="pitch">
                    <!-- Field lines -->
                    <div class="center-line"></div>
                    <div class="center-circle"></div>
                    <div class="goal-box home-box"></div>
                    <div class="goal-box away-box"></div>
                    <div class="penalty-area home-penalty"></div>
                    <div class="penalty-area away-penalty"></div>

                    <!-- Ball -->
                    <div class="ball" id="ball"></div>

                    <!-- Home team players -->
                    <div class="player home" id="p1" style="left: 10%; top: 20%;">
                        <span class="number">1</span>
                    </div>
                    <div class="player home" id="p2" style="left: 15%; top: 50%;">
                        <span class="number">2</span>
                    </div>
                    <div class="player home" id="p3" style="left: 25%; top: 35%;">
                        <span class="number">3</span>
                    </div>
                    <div class="player home" id="p4" style="left: 35%; top: 50%;">
                        <span class="number">4</span>
                    </div>
                    <div class="player home" id="p5" style="left: 50%; top: 50%;">
                        <span class="number">5</span>
                    </div>
                    <div class="player home" id="p6" style="left: 65%; top: 35%;">
                        <span class="number">6</span>
                    </div>
                    <div class="player home" id="p7" style="left: 75%; top: 65%;">
                        <span class="number">7</span>
                    </div>
                    <div class="player home" id="p8" style="left: 80%; top: 50%;">
                        <span class="number">8</span>
                    </div>
                    <div class="player home active" id="p9" style="left: 85%; top: 50%;">
                        <span class="number">9</span>
                    </div>

                    <!-- Away team players -->
                    <div class="player away" id="p10" style="right: 10%; top: 20%;">
                        <span class="number">1</span>
                    </div>
                    <div class="player away" id="p11" style="right: 15%; top: 50%;">
                        <span class="number">2</span>
                    </div>
                    <div class="player away" id="p12" style="right: 25%; top: 35%;">
                        <span class="number">3</span>
                    </div>
                    <div class="player away" id="p13" style="right: 35%; top: 50%;">
                        <span class="number">4</span>
                    </div>
                    <div class="player away" id="p14" style="right: 50%; top: 50%;">
                        <span class="number">5</span>
                    </div>
                    <div class="player away" id="p15" style="right: 65%; top: 35%;">
                        <span class="number">6</span>
                    </div>
                    <div class="player away" id="p16" style="right: 75%; top: 65%;">
                        <span class="number">7</span>
                    </div>
                    <div class="player away" id="p17" style="right: 80%; top: 50%;">
                        <span class="number">8</span>
                    </div>
                    <div class="player away active" id="p18" style="right: 85%; top: 50%;">
                        <span class="number">9</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="passBtn" onclick="passPlay()">🎯 Pass</button>
            <button class="btn" id="shootBtn" onclick="shootPlay()">⚡ Shoot</button>
            <button class="btn" id="dribbleBtn" onclick="dribblePlay()">🏃 Dribble</button>
            <button class="btn" id="defenseBtn" onclick="defendPlay()">🛡️ Defend</button>
        </div>

        <div class="match-events" id="matchEvents">
            <h3>Match Events</h3>
            <p>Match started! Press buttons to play.</p>
        </div>

        <div class="game-over" id="gameOver" style="display: none;">
            <div class="modal">
                <h2 id="gameOverTitle">Match Ended!</h2>
                <p id="gameOverMessage"></p>
                <button class="btn" onclick="restartGame()">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
